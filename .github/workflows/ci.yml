name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  compatibility:
    name: Go ${{ matrix.go-version }} headless
    runs-on: windows-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        go-version: ['1.22.x', '1.23.x', '1.24.x', '1.25.x', '1.26.x', '1.27.0-rc.3']
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: ${{ matrix.go-version }}
          cache-dependency-path: go.sum
      - name: Verify modules
        run: go mod verify
      - name: Headless tests
        run: go test -count=1 ./...

  module-graph:
    name: Module graph (Go 1.25.1)
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          # Keep tidy output stable. The compatibility matrix separately proves
          # the declared Go-version range can compile and test the module.
          go-version: '1.25.1'
          cache-dependency-path: go.sum
      - name: Verify modules
        run: go mod verify
      - name: Module graph is tidy
        run: go mod tidy -diff

  quality:
    name: Vet, race & benchmark compile
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          # Whitespace checks compare the merge-base, which is not guaranteed
          # to exist in a shallow push or pull-request checkout.
          fetch-depth: 0
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: '1.27.0-rc.3'
          cache-dependency-path: go.sum
      - name: Whitespace check
        shell: pwsh
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          BEFORE_SHA: ${{ github.event.before }}
        run: |
          $base = $env:BASE_SHA
          if ([string]::IsNullOrWhiteSpace($base)) {
            $base = $env:BEFORE_SHA
          }

          $hasBase = $false
          if (-not [string]::IsNullOrWhiteSpace($base)) {
            & git cat-file -e ($base + "^{commit}") 2>$null
            $hasBase = $LASTEXITCODE -eq 0
          }

          if ($hasBase) {
            $mergeBase = (& git merge-base HEAD $base).Trim()
            if ($LASTEXITCODE -ne 0 -or [string]::IsNullOrWhiteSpace($mergeBase)) {
              throw "无法解析空白检查的 merge-base: HEAD 与 $base"
            }
            & git diff --check "$mergeBase...HEAD"
          } else {
            # First pushes have no before SHA. Check the complete root commit
            # instead of silently comparing a missing HEAD^.
            Write-Host "未找到可比较的 base commit；按 root commit 检查空白。"
            & git diff-tree --check --root --no-commit-id -r HEAD
          }

          if ($LASTEXITCODE -ne 0) {
            exit $LASTEXITCODE
          }
      - name: Go format
        shell: pwsh
        run: |
          $unformatted = @(gofmt -l .)
          if ($unformatted.Count -ne 0) {
            $unformatted | ForEach-Object { Write-Host "::error file=$_::gofmt required" }
            exit 1
          }
      - name: Go vet
        run: go vet ./...
      - name: Race tests
        run: go test -race -count=1 ./...
      - name: Benchmark smoke
        run: go test . -run '^$' -bench 'Benchmark(ControlMount|ControlPurePropertyPatch|PageSwitch|VirtualListScrollPatch|StringGridUpdate|PaintInvalidate)$' -benchtime=1x

  native-probe:
    name: Native LCL probe
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: '1.27.0-rc.3'
          cache-dependency-path: go.sum
      - name: Fetch verified libenergy DLL
        shell: pwsh
        run: .\scripts\fetch-libenergy.ps1
      - name: Run non-race native probes
        shell: pwsh
        run: |
          $env:FVCL_LIBENERGY_DLL = (Resolve-Path .\ref\designer-lib\libenergy-amd64.dll).Path
          go test -count=1 -v ./internal/native -run '^(TestRadioButtonNative.*|TestComboBoxNativeKeyboardSelection|TestNativeEscapeRestoresAlign|TestBatch3NativeProbe|TestAccessibilityNativeProbe)$'
      - name: Run CD0 native probes
        shell: pwsh
        run: .\scripts\cd0-native-probe.ps1 -ArtifactDir .\artifacts\cd0-native
      - name: Upload CD0 native evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: cd0-native-evidence
          path: artifacts/cd0-native
          if-no-files-found: warn

  build-and-smoke:
    name: Smoke ${{ matrix.target }}
    runs-on: windows-latest
    needs: [compatibility, module-graph, quality, native-probe]
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        target:
          - basic
          - layout
          - events
          - phase5
          - form-controls
          - virtual-list
          - inspector
          - plugin-badge
          - page-control
          - accessibility-i18n
          - 7guis-counter
          - 7guis-temperature-converter
          - 7guis-flight-booker
          - 7guis-timer
          - 7guis-crud
          - 7guis-circle-drawer
          - 7guis-cells
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: '1.27.0-rc.3'
          cache-dependency-path: go.sum
      - name: Fetch verified libenergy DLL
        shell: pwsh
        run: .\scripts\fetch-libenergy.ps1
      - name: Build ${{ matrix.target }}
        shell: pwsh
        run: .\scripts\build.ps1 -Target '${{ matrix.target }}'
      - name: Smoke ${{ matrix.target }}
        shell: pwsh
        run: .\scripts\smoke.ps1 -Target '${{ matrix.target }}' -Screenshot "$env:GITHUB_WORKSPACE\bin\${{ matrix.target }}-smoke.png"
      - name: Upload smoke screenshot
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: smoke-${{ matrix.target }}
          path: bin/${{ matrix.target }}-smoke.png
          if-no-files-found: error
          retention-days: 30

  package-installer:
    name: Clean VM installer validation
    runs-on: windows-latest
    needs: [build-and-smoke]
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: '1.27.0-rc.3'
          cache-dependency-path: go.sum
      - name: Install pinned NSIS
        shell: pwsh
        run: choco install nsis --version=3.11.0 --yes --no-progress
      - name: Fetch verified libenergy DLL
        shell: pwsh
        run: .\scripts\fetch-libenergy.ps1
      - name: Build NSIS installer
        shell: pwsh
        run: .\scripts\package.ps1 -Target basic -Version 0.1.0 -AllowDevVersion
      - name: Install, launch and uninstall
        shell: pwsh
        run: .\scripts\test-installer.ps1 -InstallerPath .\bin\FluxVCL-0.1.0-basic-setup.exe -AllowDevVersion
      - name: Upload installer validation evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: FluxVCL-0.1.0-basic-installer-validation
          path: |
            bin/FluxVCL-0.1.0-basic-setup.exe.sha256
            bin/basic-installer-smoke.png
            packaging/dependencies.lock.json
          if-no-files-found: error
          # Keep clean-VM release evidence for the longest GitHub-hosted period.
          retention-days: 90
