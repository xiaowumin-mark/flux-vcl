name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  compatibility:
    name: Go ${{ matrix.go-version }} headless
    runs-on: windows-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        go-version: ['1.22.x', '1.23.x', '1.24.x', '1.25.x', '1.26.x', '1.27.0-rc.3']
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: ${{ matrix.go-version }}
          cache-dependency-path: go.sum
      - name: Verify modules
        run: go mod verify
      - name: Headless tests
        run: go test -count=1 ./...

  quality:
    name: Vet, race & benchmark compile
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 2
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: '1.27.0-rc.3'
          cache-dependency-path: go.sum
      - name: Whitespace check
        run: git diff --check HEAD^ HEAD
      - name: Go format
        shell: pwsh
        run: |
          $unformatted = @(gofmt -l .)
          if ($unformatted.Count -ne 0) {
            $unformatted | ForEach-Object { Write-Host "::error file=$_::gofmt required" }
            exit 1
          }
      - name: Module graph is tidy
        run: go mod tidy -diff
      - name: Go vet
        run: go vet ./...
      - name: Race tests
        run: go test -race -count=1 ./...
      - name: Benchmark smoke
        run: go test . -run '^$' -bench 'Benchmark(ControlMount|ControlPurePropertyPatch|PageSwitch|VirtualListScrollPatch)$' -benchtime=1x

  native-probe:
    name: Native LCL probe
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: '1.27.0-rc.3'
          cache-dependency-path: go.sum
      - name: Fetch verified libenergy DLL
        shell: pwsh
        run: .\scripts\fetch-libenergy.ps1
      - name: Run non-race native probes
        shell: pwsh
        run: |
          $env:FVCL_LIBENERGY_DLL = (Resolve-Path .\ref\designer-lib\libenergy-amd64.dll).Path
          go test -count=1 -v ./internal/native -run '^TestRadioButtonNative'

  build-and-smoke:
    name: Smoke ${{ matrix.target }}
    runs-on: windows-latest
    needs: [compatibility, quality, native-probe]
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        target:
          - basic
          - layout
          - events
          - phase5
          - form-controls
          - virtual-list
          - inspector
          - plugin-badge
          - page-control
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: '1.27.0-rc.3'
          cache-dependency-path: go.sum
      - name: Fetch verified libenergy DLL
        shell: pwsh
        run: .\scripts\fetch-libenergy.ps1
      - name: Build ${{ matrix.target }}
        shell: pwsh
        run: .\scripts\build.ps1 -Target '${{ matrix.target }}'
      - name: Smoke ${{ matrix.target }}
        shell: pwsh
        run: .\scripts\smoke.ps1 -Target '${{ matrix.target }}' -Screenshot "$env:GITHUB_WORKSPACE\bin\${{ matrix.target }}-smoke.png"
      - name: Upload smoke screenshot
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: smoke-${{ matrix.target }}
          path: bin/${{ matrix.target }}-smoke.png
          if-no-files-found: error
          retention-days: 14

  package-installer:
    name: Clean VM installer smoke
    runs-on: windows-latest
    needs: [build-and-smoke]
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: '1.27.0-rc.3'
          cache-dependency-path: go.sum
      - name: Install pinned NSIS
        shell: pwsh
        run: choco install nsis --version=3.11.0 --yes --no-progress
      - name: Fetch verified libenergy DLL
        shell: pwsh
        run: .\scripts\fetch-libenergy.ps1
      - name: Build NSIS installer
        shell: pwsh
        run: .\scripts\package.ps1 -Target basic -Version 0.1.0
      - name: Install, launch and uninstall
        shell: pwsh
        run: .\scripts\test-installer.ps1 -InstallerPath .\bin\FluxVCL-0.1.0-basic-setup.exe
      - name: Upload installer validation evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: FluxVCL-0.1.0-basic-installer-validation
          path: |
            bin/FluxVCL-0.1.0-basic-setup.exe.sha256
            bin/basic-installer-smoke.png
            packaging/dependencies.lock.json
          if-no-files-found: error
          retention-days: 14
