name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: Unit tests
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.x'
          cache-dependency-path: go.sum
      - name: Go test
        run: go test ./...
      - name: Go vet
        run: go vet ./...

  build-and-smoke:
    name: Build & Smoke (Windows GUI)
    runs-on: windows-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.x'
          cache-dependency-path: go.sum
      # CI 无本地 ref/ 副本（被 gitignore），从 designer 内嵌 zip 获取 DLL
      - name: Fetch libenergy DLL
        shell: pwsh
        run: .\scripts\fetch-libenergy.ps1
      - name: Build
        shell: pwsh
        run: .\scripts\build.ps1
      - name: Smoke test (basic)
        shell: pwsh
        run: .\scripts\smoke.ps1 -Screenshot "$env:GITHUB_WORKSPACE\bin\basic-smoke.png"
      - name: Build & Smoke (events, Phase 4)
        shell: pwsh
        run: |
          .\scripts\build.ps1 -Target events
          .\scripts\smoke.ps1 -Target events -Screenshot "$env:GITHUB_WORKSPACE\bin\events-smoke.png"
      - name: Build & Smoke (phase5, advanced features)
        shell: pwsh
        run: |
          .\scripts\build.ps1 -Target phase5
          .\scripts\smoke.ps1 -Target phase5 -Screenshot "$env:GITHUB_WORKSPACE\bin\phase5-smoke.png"
      - name: Build & Smoke (form-controls, widget baseline)
        shell: pwsh
        run: |
          .\scripts\build.ps1 -Target form-controls
          .\scripts\smoke.ps1 -Target form-controls -Screenshot "$env:GITHUB_WORKSPACE\bin\form-controls-smoke.png"
      - name: "Build & Smoke (virtual-list, Phase 6: 10万行虚拟化 + 多窗口)"
        shell: pwsh
        run: |
          .\scripts\build.ps1 -Target virtual-list
          .\scripts\smoke.ps1 -Target virtual-list -Screenshot "$env:GITHUB_WORKSPACE\bin\virtual-list-smoke.png"
      - name: Build & Smoke (inspector, P7.1)
        shell: pwsh
        run: |
          .\scripts\build.ps1 -Target inspector
          .\scripts\smoke.ps1 -Target inspector -Screenshot "$env:GITHUB_WORKSPACE\bin\inspector-smoke.png"
      - name: Build & Smoke (plugin-badge, P7.2)
        shell: pwsh
        run: |
          .\scripts\build.ps1 -Target plugin-badge
          .\scripts\smoke.ps1 -Target plugin-badge -Screenshot "$env:GITHUB_WORKSPACE\bin\plugin-badge-smoke.png"
      - name: Build & Smoke (page-control, P7.2c)
        shell: pwsh
        run: |
          .\scripts\build.ps1 -Target page-control
          .\scripts\smoke.ps1 -Target page-control -Screenshot "$env:GITHUB_WORKSPACE\bin\page-control-smoke.png"
      - name: Upload smoke screenshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-screenshots
          path: bin/*-smoke.png
          if-no-files-found: warn
